    <div class="main_container">
        <div class="title" style="color: #2e4732; text-shadow: none;">CONTACTA CON NOSOTROS</div>
        <div class="formulario">
            <form id="contact-form">
                <div class="input_container" style="margin-bottom: 15px;">
                    <label>Nombre</label>
                    <input type="text" name="name" placeholder="Tu nombre" required>
                </div>
                <div class="input_container" style="margin-bottom: 15px;">
                    <label>Email</label>
                    <input type="text" name="email" placeholder="tucorreo@ejemplo.com" required>
                </div>
                <div class="input_container" style="margin-bottom: 15px;">
                    <label>Mensaje</label>
                    <textarea cols="22" rows="6" name="message" placeholder="¿En qué podemos ayudarte?"
                        required></textarea>
                </div>

                <div class="input_container_button">
                    <button id="upload-button" type="submit"><label>ENVIAR</label></button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Plantéatelo. Todos los derechos reservados.</p>
    </footer>

    <script>
        document.getElementById('contact-form').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('¡Gracias por tu mensaje! Nos pondremos en contacto contigo pronto.');
            this.reset();
        });
    </script>
    <script src="app.js"></script>
