<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Registro - Plantéatelo</title>
    <link rel="stylesheet" href="CSS Planteatelo.css">
    <link rel="stylesheet" href="style-upload.css">
    <link rel="stylesheet" href="style-upload.css">
    <link rel="icon" href="logo/Captura_de_pantalla_2026-01-28_201021-removebg-preview.png" type="image/png">
    <!-- <link rel="stylesheet" href="mobile-orientation.css"> File not found -->
    <style>
        .auth-container {
            max-width: 400px;
            margin: 6rem auto;
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
            /* Ensure above overlay */
            transition: all 0.3s ease;
        }

        .auth-toggle {
            text-align: center;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .auth-toggle button {
            background: none;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .auth-toggle button:hover {
            color: #2d6a4f;
            background-color: rgba(45, 106, 79, 0.05);
            border-radius: 4px 4px 0 0;
        }

        .auth-toggle button.active {
            color: #2d6a4f;
            border-bottom-color: #2d6a4f;
            font-weight: 700;
        }

        .error-msg {
            color: #721c24;
            background-color: #f8d7da;
            padding: 0.8rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            border: 1px solid #f5c6cb;
            display: none;
            font-size: 0.9rem;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        form {
            animation: fadeIn 0.4s ease-out;
        }

        #register-form {
            display: none;
        }

        /* Input Enhancements */
        .input_container input:focus {
            border-color: #2d6a4f;
            box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.1);
            outline: none;
        }
    </style>
</head>

<link rel="icon" href="logo/Captura_de_pantalla_2026-01-28_201021-removebg-preview.png" type="image/png">

<body>
    <header class="header">
        <a href="index.html" class="logo"><img src="img/logo.png"></a>
        <button class="menu-toggle" aria-label="Abrir menú">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="overlay"></div>
        <nav class="nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="ecotip.html">Ecotip</a></li>
                <li><a href="formulario.html">Publicar Noticia</a></li>
                <li><a href="dia-a-dia.html">Día a día</a></li>
                <li><a href="checklist.html">Checklist</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="fuentes.html">Fuentes</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html" id="nav-login-btn">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="main_container">
        <div class="auth-container">
            <div class="auth-toggle">
                <button id="btn-show-login" class="active">Iniciar Sesión</button>
                <button id="btn-show-register">Registrarse</button>
            </div>

            <div class="error-msg" id="error-message"></div>

            <!-- LOGIN FORM -->
            <form id="login-form">
                <div class="input_container" style="margin-bottom: 10px;">
                    <label>Usuario</label>
                    <input type="text" id="login-user" required autocomplete="username">
                </div>
                <div class="input_container" style="margin-bottom: 10px;">
                    <label>Contraseña</label>
                    <input type="password" id="login-pass" required autocomplete="current-password">
                </div>
                <div class="input_container_button">
                    <button type="submit" id="login-submit">Entrar</button>
                </div>
            </form>

            <!-- REGISTER FORM -->
            <form id="register-form">
                <div class="input_container">
                    <label>Nuevo Usuario</label>
                    <input type="text" id="reg-user" required autocomplete="username">
                </div>
                <div class="input_container">
                    <label>Contraseña</label>
                    <input type="password" id="reg-pass" required autocomplete="new-password">
                </div>
                <div class="input_container_button">
                    <button type="submit" id="reg-submit">Registrarse</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Login page script loaded');
            // Usar ruta relativa para evitar problemas de CORS y puertos.
            // El backend sirve el frontend, así que /api va al mismo sitio.
            const API_BASE = '/api';
            const API_KEY = '893162e86356d5e5abf0a2fd3aac051129d2bd36281b890410c04f207f68998e';

            const btnLogin = document.getElementById('btn-show-login');
            const btnRegister = document.getElementById('btn-show-register');
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');

            if (!btnLogin || !btnRegister) {
                console.error('Botones de toggle no encontrados');
                return;
            }

            // Toggle forms
            btnLogin.onclick = () => {
                console.log('Switching to LOGIN');
                loginForm.style.display = 'grid';
                registerForm.style.display = 'none';
                btnLogin.classList.add('active');
                btnRegister.classList.remove('active');
                hideError();
            };
            btnRegister.onclick = () => {
                console.log('Switching to REGISTER');
                loginForm.style.display = 'none';
                registerForm.style.display = 'grid';
                btnLogin.classList.remove('active');
                btnRegister.classList.add('active');
                hideError();
            };

            function showError(msg) {
                const e = document.getElementById('error-message');
                e.textContent = msg;
                e.style.display = 'block';
            }
            function hideError() {
                const e = document.getElementById('error-message');
                if (e) e.style.display = 'none';
            }

            // LOGIN
            const formLogin = document.getElementById('login-form');
            if (formLogin) {
                formLogin.onsubmit = async (e) => {
                    e.preventDefault();
                    console.log('Login submit...');
                    hideError();
                    const u = document.getElementById('login-user').value;
                    const p = document.getElementById('login-pass').value;

                    try {
                        const res = await fetch(API_BASE + '/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'x-api-key': API_KEY
                            },
                            body: JSON.stringify({ username: u, password: p })
                        });

                        const text = await res.text();
                        let data;
                        try { data = JSON.parse(text); } catch (ex) { data = { error: text }; }

                        if (!res.ok) throw new Error(data.error || 'Error en login (' + res.status + ')');

                        // Save credentials Basic Auth style for simplicity in app
                        const auth = btoa(`${u}:${p}`);
                        localStorage.setItem('auth_token', auth);
                        localStorage.setItem('current_user', JSON.stringify({
                            _id: data._id,
                            username: data.username,
                            role: data.role
                        }));

                        console.log('Login success, redirecting...');
                        window.location.href = 'index.html'; // Redirect to home
                    } catch (err) {
                        console.error('Login error:', err);
                        showError(err.message);
                    }
                };
            }

            // REGISTER
            const formReg = document.getElementById('register-form');
            if (formReg) {
                formReg.onsubmit = async (e) => {
                    e.preventDefault();
                    console.log('Register submit...');
                    hideError();
                    const u = document.getElementById('reg-user').value;
                    const p = document.getElementById('reg-pass').value;

                    console.log('Intentando registro para:', u);

                    try {
                        const res = await fetch(API_BASE + '/register', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'x-api-key': API_KEY
                            },
                            body: JSON.stringify({ username: u, password: p })
                        });

                        const text = await res.text();
                        let data;
                        try { data = JSON.parse(text); } catch (ex) { data = { error: text }; }

                        if (!res.ok) throw new Error(data.error || 'Error en registro (' + res.status + ')');

                        console.log('Registro exitoso:', data);
                        alert('Registro exitoso. Por favor inicia sesión.');
                        btnLogin.click();
                    } catch (err) {
                        console.error('Registration error detailed:', err);
                        showError(err.message);
                    }
                };
            }
        });
    </script>
    <script src="app.js"></script>
</body>

</html>
